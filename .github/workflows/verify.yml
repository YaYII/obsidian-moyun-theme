name: 校验

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建与静态校验
        run: node build.mjs --check

      - name: 模块冲突检查
        run: node tools/check-conflicts.mjs --strict

      - name: 主题名合规自查
        run: node tools/check-name.mjs

      # 检查 release.yml 里的 shell 语法。
      # 为什么需要：那些 shell 只在打 tag 时于 GitHub 上执行，本地不校验就会
      # 出现「推了 tag 才发现语法错、发布失败」的情况 —— 本项目刚因此失败过一次。
      - name: 工作流 shell 语法检查
        run: node tools/check-workflow.mjs

      # 视觉验证需要下载 Chromium（约 150MB），故默认关闭。
      # 需要开启时去掉注释，并在前面补一步 npx playwright install --with-deps chromium
      # - name: 视觉与计算样式验证
      #   run: node tools/verify.mjs
