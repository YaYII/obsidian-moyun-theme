name: 校验

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建与静态校验
        run: node build.mjs --check

      - name: 模块冲突检查
        run: node tools/check-conflicts.mjs --strict

      # 视觉验证需要下载 Chromium（约 150MB），故默认关闭。
      # 需要开启时去掉注释，并在前面补一步 npx playwright install --with-deps chromium
      # - name: 视觉与计算样式验证
      #   run: node tools/verify.mjs
