name: 发布主题

# Obsidian 社区目录要求：GitHub Release 的 tag 必须与 manifest.json 的 version
# 【完全一致】，即 1.0.4 而不是 v1.0.4 —— 它靠这个 tag 定位安装资源。
# 本项目最初沿用 Git 社区的 v 前缀惯例，导致目录报错：
#   「没有版本与您的清单版本匹配」
on:
  push:
    tags:
      # 只匹配以数字开头的 tag（如 1.0.4）。刻意不匹配 v1.0.4：
      # 带 v 前缀的 tag 对 Obsidian 而言等于不存在。
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建 theme.css
        run: node build.mjs

      - name: 校验构建产物
        run: node build.mjs --check

      - name: 模块冲突检查（严格模式）
        run: node tools/check-conflicts.mjs --strict

      - name: 主题名合规自查
        run: node tools/check-name.mjs

      # 硬性把关：tag 与 manifest.version 必须逐字符相同。
      # 这是 Obsidian 目录识别发布版本的唯一依据，写错就等于没发布。
      - name: 校对 tag 与 manifest.version 完全一致
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG=$(node -p 'require("./manifest.json").version')
          echo "tag=$TAG  manifest.version=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG 与 manifest.json 的 version $PKG 不一致"
            echo "::error::Obsidian 要求两者完全相同且不带 v 前缀，否则社区目录无法识别该发布版本"
            exit 1
          fi

      # 坑位说明：这里必须用【单引号】包住 node -p 的表达式。
      # 曾写成 echo "theme_name=$(node -p \"require('./manifest.json').name\")"，
      # 转义后内层双引号提前结束 shell 字符串，报 syntax error near `('，发布失败。
      - name: 读取主题名（避免硬编码，改名后自动同步）
        id: meta
        run: |
          THEME_NAME=$(node -p 'require("./manifest.json").name')
          echo "theme_name=$THEME_NAME" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传主题资产
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.theme_name }} ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          # Release 说明后附上赞助二维码：下载页面就是最常被看到的地方。
          # 用 append_body 而不是 body —— body 会顶掉自动生成的变更说明。
          append_body: |
            ---
            ## 赞助 / Sponsor

            墨韵是业余时间的作品。如果它让你的中文阅读舒服了一点，欢迎扫码支持 ——
            **完全自愿，不影响任何功能**。

            <table>
              <tr>
                <td align="center">
                  <img src="https://raw.githubusercontent.com/YaYII/obsidian-moyun-theme/master/docs/sponsor/wechat-pay.jpg" width="240" alt="微信支付收款码" />
                  <br /><b>微信支付</b>
                </td>
                <td align="center">
                  <img src="https://raw.githubusercontent.com/YaYII/obsidian-moyun-theme/master/docs/sponsor/alipay.jpg" width="240" alt="支付宝收款码" />
                  <br /><b>支付宝</b>
                </td>
              </tr>
            </table>
          files: |
            manifest.json
            theme.css
