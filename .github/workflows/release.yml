name: 发布主题

# BRAT（Beta Reviewers Auto-update Tool）只认 GitHub Release 上的两个附件：
#   manifest.json 与 theme.css
# 主题【不需要】versions.json —— 那是插件的机制，主题没有版本清单文件。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建 theme.css
        run: node build.mjs

      - name: 校验构建产物
        run: node build.mjs --check

      - name: 模块冲突检查（严格模式）
        run: node tools/check-conflicts.mjs --strict

      - name: 主题名合规自查
        run: node tools/check-name.mjs

      - name: 校对 manifest 与 tag 版本一致
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PKG=$(node -p 'require("./manifest.json").version')
          echo "tag=$TAG  manifest=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG 与 manifest.json 的版本 $PKG 不一致，请先同步版本号"
            exit 1
          fi

      # 坑位说明：这里必须用【单引号】包住 node -p 的表达式。
      # 曾写成 echo "theme_name=$(node -p \"require('./manifest.json').name\")"，
      # 在 YAML 里转义后内层双引号会提前结束 shell 字符串，报
      #   bash: syntax error near unexpected token `('  → 整个发布流程失败。
      # 多行块 + 单引号才是安全写法。
      - name: 读取主题名（避免在 workflow 里硬编码，改名后自动同步）
        id: meta
        run: |
          THEME_NAME=$(node -p 'require("./manifest.json").name')
          echo "theme_name=$THEME_NAME" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传主题资产
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.theme_name }} ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            manifest.json
            theme.css
